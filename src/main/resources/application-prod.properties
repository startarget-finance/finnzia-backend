# Configurações de produção (Render: SPRING_DATASOURCE_URL ou DB_URL + DB_USERNAME + DB_PASSWORD)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/finnza_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# HikariCP Connection Pool (otimizado para produção)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA/Hibernate
# Banco novo (Render): Flyway ainda não cobre todas as @Entity — validate derruba o boot.
# Padrão update: Hibernate cria/ajusta o que faltar. Em produção madura, defina DDL_AUTO=validate no Render.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_schema=public

# Flyway migrations (Render/producao) — credenciais herdam de spring.flyway.* no application.properties
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Banco existente sem historico Flyway: considera V2 aplicada e executa V003+ automaticamente.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# Batch Processing (otimização para operações em massa)
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Desabilitar open-in-view para melhor performance
spring.jpa.open-in-view=false

# JWT Configuration (use variáveis de ambiente em produção)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Logging (produção - apenas erros e warnings)
logging.level.root=WARN
logging.level.com.finnza=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Actuator (apenas health em produção)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Asaas Configuration (use variáveis de ambiente no Render)
asaas.api.key=${ASAAS_API_KEY:}
asaas.api.url=${ASAAS_API_URL:https://sandbox.asaas.com/api/v3}
asaas.mock.enabled=${ASAAS_MOCK_ENABLED:false}
# Importação automática de contratos na inicialização (padrão: true)
asaas.importacao.automatica.enabled=${ASAAS_IMPORTACAO_AUTOMATICA_ENABLED:true}
asaas.sync.enabled=${ASAAS_SYNC_ENABLED:true}
asaas.sync.cron=${ASAAS_SYNC_CRON:0 */20 * * * *}

# Omie Configuration (use variáveis de ambiente em produção)
omie.app.key=${OMIE_APP_KEY:}
omie.app.secret=${OMIE_APP_SECRET:}
omie.api.url=${OMIE_API_URL:https://app.omie.com.br/api/v1}
omie.mock.enabled=${OMIE_MOCK_ENABLED:false}

# ── Bom Controle Sync ───────────────────────────────────────────────────────
# ID da empresa padrão usada pelos jobs de sincronização automática
bomcontrole.default.empresa.id=${BOMCONTROLE_DEFAULT_EMPRESA_ID:6}

# Sync automático no startup
bomcontrole.sync.startup.enabled=${BOMCONTROLE_SYNC_STARTUP_ENABLED:true}
bomcontrole.sync.startup.meses=${BOMCONTROLE_SYNC_STARTUP_MESES:18}
bomcontrole.sync.startup.min-registros=${BOMCONTROLE_SYNC_STARTUP_MIN_REGISTROS:50}
bomcontrole.sync.startup.delay-entre-meses-ms=${BOMCONTROLE_SYNC_STARTUP_DELAY_MS:10000}

# ── E-mail (convite ao criar usuário, recuperação de senha, código no perfil) ──
# Padrão em application.properties: APP_MAIL_PASSWORD_RESET_ENABLED=false → nenhum e-mail é enviado.
# No Render: APP_MAIL_PASSWORD_RESET_ENABLED=true, MAIL_USERNAME, MAIL_PASSWORD, opcional MAIL_HOST/MAIL_PORT,
# PASSWORD_RESET_FRONTEND_BASE_URL (URL do front, sem barra no final).
# Herda spring.mail.* de application.properties; não duplicar segredos aqui.
