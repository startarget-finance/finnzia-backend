# Desenvolvimento — mesmo PostgreSQL que application.properties (não usar H2 aqui:
# H2 no classpath de runtime fazia o Spring criar banco em memória quando SPRING_DATASOURCE_URL
# vinha vazia do IntelliJ, “sumindo” seus usuários do Postgres).

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Omie Configuration
omie.app.key=${OMIE_APP_KEY:}
omie.app.secret=${OMIE_APP_SECRET:}
omie.api.url=${OMIE_API_URL:https://app.omie.com.br/api/v1}
omie.mock.enabled=${OMIE_MOCK_ENABLED:false}
