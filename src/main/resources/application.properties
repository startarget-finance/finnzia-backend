# Configurações da aplicação
spring.application.name=finnza-backend
server.port=8080

# Configurações do banco de dados
# PostgreSQL (padrão para desenvolvimento e produção)
#
# IntelliJ: remova SPRING_DATASOURCE_URL se estiver vazia (ou preencha com a URL do Postgres).
# FinnzaDatasourceEnvironmentPostProcessor corrige URL vazia para Postgres local mesmo assim.
# H2 no pom: escopo "test" — após alterar o pom, faça Maven Reload no IntelliJ.
spring.datasource.url=jdbc:postgresql://localhost:5432/finnza_db
spring.datasource.username=arthurbowens
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# Para usar H2 (em memória) - descomente se necessário
# spring.datasource.url=jdbc:h2:mem:finnza_db
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=

# HikariCP Connection Pool (desenvolvimento)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# Flyway migrations (schema versionado)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Em banco legado sem flyway_schema_history, baseline em V2 para aplicar V003+ sem reexecutar histórico antigo.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# Batch Processing (desenvolvimento)
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# H2 Console (desabilitado quando usar PostgreSQL)
spring.h2.console.enabled=false

# JWT Configuration
jwt.secret=mySecretKeyForFinnzaFinancialSystem2024SecureAndLongKeyForJWTTokenGeneration
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.finnza=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── Bom Controle Sync ───────────────────────────────────────────────────────
# ID da empresa padrão usada pelos jobs de sincronização automática.
# Sobrescreva via variável de ambiente: BOMCONTROLE_DEFAULT_EMPRESA_ID
bomcontrole.default.empresa.id=${BOMCONTROLE_DEFAULT_EMPRESA_ID:1}

# Sync automático no startup
# Habilita/desabilita o sync histórico na inicialização
bomcontrole.sync.startup.enabled=${BOMCONTROLE_SYNC_STARTUP_ENABLED:true}
# Quantos meses para trás buscar no primeiro sync
bomcontrole.sync.startup.meses=${BOMCONTROLE_SYNC_STARTUP_MESES:18}
# Mínimo de registros para considerar o banco já populado (pula o startup sync)
bomcontrole.sync.startup.min-registros=${BOMCONTROLE_SYNC_STARTUP_MIN_REGISTROS:50}
# Delay entre meses durante o sync de startup (ms) — não diminua muito para evitar rate limit
bomcontrole.sync.startup.delay-entre-meses-ms=${BOMCONTROLE_SYNC_STARTUP_DELAY_MS:10000}

# Asaas Configuration — chave apenas por empresa (empresa_config), sem variável global
asaas.api.url=${ASAAS_API_URL:https://sandbox.asaas.com/api/v3}
asaas.mock.enabled=${ASAAS_MOCK_ENABLED:true}
# Importação automática de contratos na inicialização (padrão: true)
asaas.importacao.automatica.enabled=${ASAAS_IMPORTACAO_AUTOMATICA_ENABLED:true}

# Omie Configuration
# Configure via variáveis de ambiente no IntelliJ (Run Configuration)
# Nunca commite as credenciais aqui!
# OMIE DESABILITADO TEMPORARIAMENTE
omie.app.key=${OMIE_APP_KEY:}
omie.app.secret=${OMIE_APP_SECRET:}
omie.api.url=${OMIE_API_URL:https://app.omie.com.br/api/v1}
omie.mock.enabled=${OMIE_MOCK_ENABLED:true}

# Bom Controle Configuration
# Configure via variáveis de ambiente no IntelliJ (Run Configuration)
# Nunca commite a API Key aqui!
bomcontrole.api.key=${BOMCONTROLE_API_KEY:}
bomcontrole.api.url=${BOMCONTROLE_API_URL:https://apinewintegracao.bomcontrole.com.br}
bomcontrole.mock.enabled=${BOMCONTROLE_MOCK_ENABLED:false}

# Clint Configuration
# Configure via variáveis de ambiente no IntelliJ (Run Configuration) ou Vercel
# Nunca commite a URL do webhook aqui!
clint.webhook.url=${CLINT_WEBHOOK_URL:https://functions-api.clint.digital/endpoints/integration/webhook/1a4381ef-bc1a-4a6f-81a9-8ce684649adb}

# ===========================
# AI Chat (Assistente Financeiro)
# ===========================
ai.openai.api.key=${OPENAI_API_KEY:}
ai.openai.api.url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
ai.openai.max-tokens=${AI_MAX_TOKENS:1000}
ai.openai.temperature=${AI_TEMPERATURE:0.7}
ai.system.prompt=${AI_SYSTEM_PROMPT:Você é um assistente financeiro especializado em análise de contratos, gestão financeira e ERP. Responda de forma clara e profissional.}